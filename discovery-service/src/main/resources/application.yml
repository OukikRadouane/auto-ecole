spring:
  application:
    name: discovery-service
  config:
    import: optional:configserver:http://localhost:8092
  security:
    user:
      name: user
      password: password
server:
  port: 8091

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://{eureka.instance.hostname}:${server.port}/eureka/
