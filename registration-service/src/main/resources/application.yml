spring:
  application:
    name: registration-service

  #datasource:
   # password: password
    #url: jdbc:mysql://${eureka.instance.hostname}:3306/registration_db
    #username: root
    #driver-class-name: com.mysql.cj.jdbc.Driver

 # security:
  #  user:
   #   name: user
    #  password: 000
  config:
    import: optional:configserver:http://localhost:8092
#server:
 # port: 8085




  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/registration_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    jwt:
      secret: ${JWT_SECRET:your-256-bit-secret-key-for-registration-service}
      expiration: 86400000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3
      acks: all
    consumer:
      group-id: registration-service-group-v1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "user-created:com.auto.registration.events.UserCreatedEvent"
      auto-offset-reset: earliest
      enable-auto-commit: false


eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8091/eureka
    enabled: true


# discovery-service 8761

server:
  port: 8085
  servlet:
    context-path: /api

logging:
  level:
    com.auto.registration: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.kafka: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# MinIO
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:registrations}

# Kafka Topics
kafka:
  topics:
    user-events: user-events
    registration-events: registration-events

# CORS
cors:
  allowed-origins: http://localhost:3000,http://localhost:4200

