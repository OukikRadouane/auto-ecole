version: '3.8'

services:
  # ─── MINIO ───
  minio:
    image: quay.io/minio/minio:latest
    container_name: auto-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - driveedu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ─── FFMPEG (CORRIGÉ) ───
  ffmpeg:
    image: jrottenberg/ffmpeg:latest
    container_name: auto-ffmpeg
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
    volumes:
      - C:/Users/Pc/AppData/Local/Temp/auto-ffmpeg:/tmp/auto-ffmpeg
    networks:
      - driveedu-network
    restart: unless-stopped

  # ─── ZOOKEEPER ───
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: auto-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - driveedu-network
    restart: unless-stopped

  # ─── KAFKA ───
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: auto-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - driveedu-network
    restart: unless-stopped

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: auto-kafdrop
    depends_on:
      - kafka
    ports:
      - "9002:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
    networks:
      - driveedu-network
    restart: unless-stopped

volumes:
  minio_data:

networks:
  driveedu-network:
    driver: bridge